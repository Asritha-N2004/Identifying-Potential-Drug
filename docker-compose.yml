services:
  postgres:
    image: postgres:16.15-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U research -d research]
      interval: 10s
      retries: 12
    restart: unless-stopped
  neo4j:
    image: neo4j:5.26.32-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-demo-change-me}
      NEO4J_server_memory_heap_initial__size: 128m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 128m
    volumes: [neo4j_data:/data]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -a bolt://localhost:7687 -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1;' >/dev/null"]
      interval: 15s
      retries: 20
      start_period: 40s
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://research:${POSTGRES_PASSWORD:-local-demo-change-me}@postgres:5432/research
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-demo-change-me}
      FRONTEND_URL: http://localhost:8080
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
    volumes: [model_data:/app/models, runtime_data:/app/runtime, source_data:/app/data/real]
    depends_on:
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 20
    restart: unless-stopped
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["127.0.0.1:8080:80"]
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "wget -q -O /dev/null http://localhost || exit 1"]
      interval: 15s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
  neo4j_data:
  model_data:
  runtime_data:
  source_data:
